name: lastfm-watch

on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probar sin enviar a Telegram"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lastfm-watch
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Revisión semanal
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WINDOW_DAYS: "8"
          MAX_FINDINGS: "25"
          TIMEZONE: Europe/Madrid
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: npm start
